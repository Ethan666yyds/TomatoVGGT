[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tomatovggt"
version = "0.1.0"
description = "Portable calibrated-rig inference for TomatoVGGT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<3", "numpy>=1.26,<3", "Pillow>=10,<13", "safetensors>=0.4,<1", "huggingface_hub>=0.34,<1", "einops>=0.8,<1"]

[project.scripts]
tomatovggt-infer = "tomatovggt.inference:main"

[tool.setuptools.packages.find]
where = ["src"]
